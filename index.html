<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/main.css" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <script defer src="src/main.js"></script>
    <title>JSON Formatter</title>
  </head>
  <body>
    <div class="container">
      <textarea
        class="large-area large-area--input"
        placeholder="Cole seu JSON aqui... (Ctrl+Enter para formatar)"
        spellcheck="false"
        aria-label="Entrada JSON"
      ></textarea>

      <div class="controls">
        <button type="button" class="controls__button controls__button--format">
          Format
        </button>
        <button type="button" class="controls__button controls__button--minify">
          Minify
        </button>
        <button type="button" class="controls__button controls__button--tree">
          Tree
        </button>
        <button type="button" class="controls__button controls__button--clear">
          Clear
        </button>
      </div>

      <div class="output-panel">
        <button
          type="button"
          class="copy-button"
          hidden
          aria-label="Copiar JSON"
        >
          Copiar
        </button>
        <pre
          class="large-area large-area--output"
          aria-label="Saída JSON"
        ></pre>
      </div>
    </div>
  </body>
</html>
